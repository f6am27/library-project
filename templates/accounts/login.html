<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الدخول — مكتبة دمشقية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root {
      --teal:      #2d6b6b;
      --teal-dark: #1e4a4a;
      --gold:      #c9a84c;
      --gold-light:#e2c278;
      --bg:        #f4f1eb;
      --surface:   #ffffff;
      --text:      #1a1a1a;
      --border:    #e5e0d5;
      --muted:     #6b7280;
    }
    [data-theme="dark"] {
      --bg:      #0f1e1e;
      --surface: #162828;
      --text:    #f0ebe0;
      --border:  #2a3d3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* خلفية مزخرفة */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(45,107,107,.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(201,168,76,.1) 0%, transparent 40%);
      pointer-events: none;
    }
    .pattern {
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Ccircle cx='20' cy='20' r='1' fill='%232d6b6b' fill-opacity='0.06'/%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(30,74,74,.12);
      position: relative;
      z-index: 1;
      animation: slideUp .5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-circle {
      width: 72px; height: 72px;
      background: var(--teal-dark);
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: .8rem;
      box-shadow: 0 8px 24px rgba(30,74,74,.25);
    }
    .logo-circle span {
      font-family: 'Amiri', serif;
      color: var(--gold);
      font-size: 2rem;
    }
    .login-title {
      font-family: 'Amiri', serif;
      font-size: 1.5rem;
      color: var(--teal-dark);
    }
    [data-theme="dark"] .login-title { color: var(--gold); }
    .login-sub { color: var(--muted); font-size: .85rem; margin-top: .2rem; }

    .form-group { margin-bottom: 1.1rem; }
    .form-label {
      display: block;
      font-size: .83rem;
      color: var(--muted);
      margin-bottom: .4rem;
    }
    .input-wrap { position: relative; }
    .input-wrap i {
      position: absolute; right: .9rem; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); font-size: .95rem;
    }
    .form-control {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: .7rem .9rem .7rem 2.4rem;
      font-family: 'Tajawal', sans-serif;
      font-size: .95rem;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(45,107,107,.12);
      background: var(--surface);
    }
    .btn-login {
      width: 100%;
      background: var(--teal-dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: .85rem;
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .2s, transform .1s;
    }
    .btn-login:hover { background: var(--teal); transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }

    .divider {
      text-align: center;
      margin: 1.2rem 0;
      color: var(--muted);
      font-size: .8rem;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute; top: 50%;
      width: 38%; height: 1px;
      background: var(--border);
    }
    .divider::before { right: 0; }
    .divider::after  { left: 0; }

    .error-box {
      background: rgba(192,57,43,.08);
      border: 1px solid rgba(192,57,43,.2);
      border-radius: 10px;
      padding: .7rem 1rem;
      margin-bottom: 1rem;
      font-size: .85rem;
      color: #c0392b;
      display: flex; align-items: center; gap: .5rem;
    }
    .theme-toggle {
      position: fixed; top: 1rem; left: 1rem;
      width: 38px; height: 38px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--muted);
      transition: all .2s;
    }
    .theme-toggle:hover { border-color: var(--gold); color: var(--gold); }

    .gold-line {
      height: 3px;
      background: linear-gradient(90deg, var(--teal-dark), var(--gold), var(--teal-dark));
      border-radius: 3px;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
<div class="pattern"></div>

<button class="theme-toggle" onclick="toggleTheme()">
  <i class="bi bi-moon-stars" id="theme-icon"></i>
</button>

<div class="login-card">
  <div class="login-logo">
    <div class="logo-circle"><span>د</span></div>
    <div class="login-title">مكتبة دمشقية</div>
    <div class="login-sub">لوحة إدارة المكتبة</div>
  </div>

  <div class="gold-line"></div>

  {% if form.errors %}
  <div class="error-box">
    <i class="bi bi-x-circle"></i>
    اسم المستخدم أو كلمة المرور غير صحيحة
  </div>
  {% endif %}

  {% for message in messages %}
  <div class="error-box" style="{% if message.tags == 'success' %}background:rgba(39,174,96,.08);border-color:rgba(39,174,96,.2);color:#27ae60{% endif %}">
    <i class="bi bi-{% if message.tags == 'success' %}check-circle{% else %}x-circle{% endif %}"></i>
    {{ message }}
  </div>
  {% endfor %}

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">اسم المستخدم</label>
      <div class="input-wrap">
        <i class="bi bi-person"></i>
        <input type="text" name="username" class="form-control"
               placeholder="أدخل اسم المستخدم" autocomplete="username" required/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">كلمة المرور</label>
      <div class="input-wrap">
        <i class="bi bi-lock"></i>
        <input type="password" name="password" id="pwd" class="form-control"
               placeholder="••••••••" autocomplete="current-password" required/>
        <i class="bi bi-eye" id="eye-icon"
           style="left:.9rem; right:auto; cursor:pointer"
           onclick="togglePwd()"></i>
      </div>
    </div>
    <button type="submit" class="btn-login">
      <i class="bi bi-box-arrow-in-right me-1"></i> دخول
    </button>
  </form>

  <div style="text-align:center; margin-top:1.5rem; color:var(--muted); font-size:.78rem">
    مكتبة دمشقية &mdash; نظام إدارة المكتبة
  </div>
</div>

<script>
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('theme-icon').className = saved === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.getElementById('theme-icon').className = next === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
  }

  function togglePwd() {
    const p = document.getElementById('pwd');
    const e = document.getElementById('eye-icon');
    if (p.type === 'password') {
      p.type = 'text'; e.className = 'bi bi-eye-slash';
      e.style.cssText = 'left:.9rem; right:auto; cursor:pointer; position:absolute; top:50%; transform:translateY(-50%); color:var(--muted)';
    } else {
      p.type = 'password'; e.className = 'bi bi-eye';
      e.style.cssText = 'left:.9rem; right:auto; cursor:pointer; position:absolute; top:50%; transform:translateY(-50%); color:var(--muted)';
    }
  }
</script>
</body>
</html>
