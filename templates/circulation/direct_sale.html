{% extends "base/base.html" %}
{% block title %}تسجيل بيع مباشر — مكتبة دمشقية{% endblock %}
{% block page_title %}تسجيل بيع مباشر{% endblock %}

{% block content %}
<div style="max-width:700px">
  <div class="card">
    <div class="card-header-custom">
      <i class="bi bi-cart-check"></i>
      <span>تسجيل بيع مباشر للزوار</span>
    </div>
    <div style="padding:1.5rem">

      <div style="background:rgba(201,168,76,.06); border:1px solid rgba(201,168,76,.2); border-radius:10px; padding:.9rem; margin-bottom:1.3rem; font-size:.83rem; color:var(--text-muted)">
        <i class="bi bi-whatsapp" style="color:#25D366"></i>
        استخدم هذه الصفحة لتسجيل مبيعات تمت عبر واتساب أو بشكل مباشر في المكتبة
      </div>

      <form method="post">
        {% csrf_token %}
        <div style="display:flex; flex-direction:column; gap:1rem; margin-bottom:1.3rem">
          <div>
            <label class="form-label">اسم المشتري</label>
            <input type="text" name="buyer_name" class="form-control"
                   placeholder="اسم المشتري (اختياري)" />
          </div>
          <div>
            <label class="form-label">اختر الكتاب <span style="color:var(--danger)">*</span></label>
            <select name="book_id" class="form-select" required>
              <option value="">— اختر كتاباً —</option>
              {% for book in books %}
              {% with sale_count=book.available_sale_copies %}
              <option value="{{ book.pk }}"
                {% if sale_count == 0 %}disabled{% endif %}>
                {{ book.title }} — {{ book.price }} MRU
                {% if sale_count > 0 %}
                  ({{ sale_count }} نسخة متاحة)
                {% else %}
                  (نفدت النسخ)
                {% endif %}
              </option>
              {% endwith %}
              {% endfor %}
            </select>
          </div>
        </div>
        <div style="display:flex; gap:.8rem; padding-top:1.2rem; border-top:1px solid var(--border)">
          <button type="submit" class="btn-gold"
                  onclick="return confirm('تأكيد تسجيل البيع؟ سيتم تحديث المخزون تلقائياً.')">
            <i class="bi bi-check-lg"></i> تسجيل البيع
          </button>
          <a href="{% url 'loan_list' %}" class="btn-outline-custom">
            <i class="bi bi-x"></i> إلغاء
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
